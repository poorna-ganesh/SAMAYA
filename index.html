<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart TT Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
</head>
<body>
  <div id="vanta-bg"></div>
  <div class="container">
    <h2>Smart Timetable Generator</h2>
    <form action="/generate" method="POST" enctype="multipart/form-data">
      <label>Upload PDF:</label>
      <input type="file" name="pdf" required>

      <div id="teacher-subject-container">
        <div class="pair">
          <input type="text" name="teacher[]" placeholder="Teacher Name" required>
          <input type="text" name="subject[]" placeholder="Subject" required>
        </div>
      </div>

      <button type="button" onclick="addPair()">Add Another</button>

      <input type="text" name="year" placeholder="Year" required>
      <input type="time" name="class_start_time" required>
      <input type="number" name="class_duration" placeholder="Class Duration (mins)" required>
      <input type="number" name="num_periods" placeholder="Periods per Day" required>

      <button type="submit">Generate Timetable</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
